<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <title>Ridirect...</title>
    
    <!-- CSS -->
    <link type="text/css" rel="stylesheet" href="css/style.css">

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<body>
<script>

  function getAuthData() {
    const token =
      sessionStorage.getItem("sessionToken") ||
      localStorage.getItem("sessionToken");

    const userRaw =
      sessionStorage.getItem("userData") ||
      localStorage.getItem("userData");

    if (!token || !userRaw) return null;

    try {
      return {
        token,
        user: JSON.parse(userRaw),
      };
    } catch {
      return null;
    }
  }

    
   const auth = getAuthData();

  // Utente NON loggato
  if (!auth) {
    window.location.href = "auth/autenticazione.html?tab=login";
  } else {
    const role = (auth.user.role || "").toLowerCase().trim();

   
    if (role === "mentor") {
      window.location.href = "mentor_dashboard.html";
    } else {
      window.location.href = "mentee_dashboard.html";
    }
  }

</script>
</body>
</html>

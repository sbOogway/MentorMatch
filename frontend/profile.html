<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MentorMatch - Esame pratico di Tecnologie Innovative per lo Sviluppo Web di I.G. e K.S."
    />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <title>Profilo - MentorMatch</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png" />

    <!-- CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link type="text/css" rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script>
    const apiBaseUrl = ""; // come nei tuoi file

    function showAlert(containerId, msg, type = "danger") {
      const html = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${msg}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>`;
      $(`#${containerId}`).html(html);
    }

    function authHeaders() {
      const token = localStorage.getItem("sessionToken");
      return token ? { "Authorization": "Bearer " + token } : {};
    }

    function getUserLocal() {
      try { return JSON.parse(localStorage.getItem("userData") || "null"); }
      catch { return null; }
    }

    function requireLogin() {
      const token = localStorage.getItem("sessionToken");
      const user = getUserLocal();
      if (!token || !user) {
        window.location.href = "/auth/autenticazione.html?tab=login";
        return false;
      }
      return true;
    }

    
    function apiGetMe(successCb, errorCb) {
      
      const user = getUserLocal();
      $.ajax({
        url: `${apiBaseUrl}/api/users/me`,
        type: "GET",
        headers: authHeaders(),
        success: successCb,
        error: function () {
          if (!user?.id) return errorCb?.();
          $.ajax({
            url: `${apiBaseUrl}/api/users/${user.id}`,
            type: "GET",
            headers: authHeaders(),
            success: successCb,
            error: errorCb
          });
        }
      });
    }

    function apiUpdateMe(payload, successCb, errorCb) {
      $.ajax({
        url: `${apiBaseUrl}/api/users/me`,
        type: "PUT",
        contentType: "application/json",
        headers: authHeaders(),
        data: JSON.stringify(payload),
        success: successCb,
        error: errorCb
      });
    }

    function apiGetMyBookings(successCb, errorCb) {
      
      $.ajax({
        url: `${apiBaseUrl}/api/booking/me`,
        type: "GET",
        headers: authHeaders(),
        success: successCb,
        error: function () {
          $.ajax({
            url: `${apiBaseUrl}/api/bookings/my`,
            type: "GET",
            headers: authHeaders(),
            success: successCb,
            error: errorCb
          });
        }
      });
    }

    function formatDateTime(iso) {
      if (!iso) return "N/D";
      const d = new Date(iso);
      return d.toLocaleString("it-IT", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    }

    $(document).ready(function () {
      if (!requireLogin()) return;

      const userLocal = getUserLocal();
      const role = (userLocal?.role || "").toLowerCase().trim();

      
      if (role === "mentor") $("#goDashboard").attr("href", "/mentor_dashboard.html");
      else $("#goDashboard").attr("href", "/mentee_dashboard.html");

    
      $("#logoutBtn").on("click", function () {
        localStorage.removeItem("sessionToken");
        localStorage.removeItem("userData");
        window.location.href = "/index.html";
      });

      
      apiGetMe(function (me) {
      
        localStorage.setItem("userData", JSON.stringify(me));

        $("#fullName").val(me.full_name || "");
        $("#email").val(me.email || "");
        $("#roleBadge").text((me.role || role || "utente").toString());

        
        $("#bio").val(me.bio || "");
        $("#bioWrap").toggle(role === "mentor");

        
        const areas = (me.area_competenza || me.sectors || []);
        $("#areas").val(Array.isArray(areas) ? areas.join(", ") : String(areas || ""));
        $("#areasWrap").toggle(role === "mentor");

      }, function () {
        showAlert("profileFeedback", "Impossibile caricare il profilo. Endpoint /api/users/me non disponibile o token non valido.", "warning");
      });

      
      $("#profileForm").on("submit", function (e) {
        e.preventDefault();

        const userLocalNow = getUserLocal();
        const roleNow = (userLocalNow?.role || role).toLowerCase().trim();

        const payload = {
          full_name: $("#fullName").val().trim(),
          
          bio: $("#bio").val().trim()
        };

        if (roleNow === "mentor") {
          
          const raw = $("#areas").val().trim();
          payload.area_competenza = raw ? raw.split(",").map(s => s.trim()).filter(Boolean) : [];
        }

        apiUpdateMe(payload, function (res) {
          showAlert("profileFeedback", "Profilo aggiornato con successo.", "success");
        
          if (res?.user) localStorage.setItem("userData", JSON.stringify(res.user));
        }, function (xhr) {
          showAlert("profileFeedback",
            "Errore aggiornamento profilo. Verifica endpoint PUT /api/users/me (o permessi).",
            "danger"
          );
        });
      });

      
      apiGetMyBookings(function (list) {
        const bookings = Array.isArray(list) ? list : (list?.items || list?.bookings || []);
        const tbody = $("#bookingsTbody");
        tbody.empty();

        if (!bookings || bookings.length === 0) {
          tbody.append(`<tr><td colspan="4" class="text-muted">Nessuna prenotazione trovata.</td></tr>`);
          return;
        }

        bookings.forEach(b => {
          const when = formatDateTime(b.start_time || b.slot_start || b.start);
          const withWho = b.mentor_name || b.mentee_name || b.with || "N/D";
          const status = b.status || (b.is_cancelled ? "Cancellata" : "Confermata");
          const link = b.meeting_link || b.meet_link || "";

          tbody.append(`
            <tr>
              <td>${when}</td>
              <td>${withWho}</td>
              <td>${status}</td>
              <td>${link ? `<a href="${link}" target="_blank" rel="noopener">Apri link</a>` : `<span class="text-muted">—</span>`}</td>
            </tr>
          `);
        });
      }, function () {
        
        $("#bookingsTbody").html(`<tr><td colspan="4" class="text-muted">Endpoint prenotazioni non disponibile (GET /api/booking/me).</td></tr>`);
      });
    });
  </script>
</head>

<body style="padding-top:55px;">
  <div id="header-placeholder"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h3 fw-bold mb-1">Il mio profilo</h1>
        <span class="badge bg-dark" id="roleBadge">utente</span>
      </div>
      <div class="d-flex gap-2">
        <a id="goDashboard" class="btn btn-outline-dark" href="/dashboard_router.html">
          <i class="bi bi-grid me-1"></i> Dashboard
        </a>
        <button id="logoutBtn" class="btn btn-dark">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>

    <div class="row g-4">
      <!-- Card profilo -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">Dati account</h2>

            <div id="profileFeedback"></div>

            <form id="profileForm">
              <div class="mb-3">
                <label class="form-label" for="fullName">Nome completo</label>
                <input class="form-control" id="fullName" type="text" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" disabled />
              </div>

              <!-- Solo mentor -->
              <div class="mb-3" id="bioWrap" style="display:none;">
                <label class="form-label" for="bio">Descrizione (bio)</label>
                <textarea class="form-control" id="bio" rows="4" placeholder="Descrivi la tua esperienza..."></textarea>
              </div>

              <div class="mb-3" id="areasWrap" style="display:none;">
                <label class="form-label" for="areas">Aree di competenza (separate da virgola)</label>
                <input class="form-control" id="areas" type="text" placeholder="Es. Software, Data, Product" />
                <div class="form-text">Se usi filtri fissi in index, meglio usare valori coerenti.</div>
              </div>

              <button class="btn btn-dark w-100" type="submit">
                <i class="bi bi-save me-2"></i> Salva modifiche
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Agenda -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 fw-bold mb-3">Agenda / Prenotazioni</h2>

            <div class="table-responsive">
              <table class="table align-middle">
                <thead>
                  <tr>
                    <th>Quando</th>
                    <th>Con</th>
                    <th>Stato</th>
                    <th>Meeting</th>
                  </tr>
                </thead>
                <tbody id="bookingsTbody">
                  <tr><td colspan="4" class="text-muted">Caricamento...</td></tr>
                </tbody>
              </table>
            </div>

            <div class="text-muted small">
              Se non compaiono dati, chiedi al backend di esporre GET /api/booking/me (o /api/bookings/me).
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
          crossorigin="anonymous"></script>
  <script src="/js/headerfooterloader.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MentorMatch - Esame pratico di Tecnologie Innovative per lo Sviluppo Web di I.G. e K.S."
    />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <title>Profilo - MentorMatch</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png" />

    <!-- CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link type="text/css" rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script>
      const apiBaseUrl = "";
  let currentUser = null;

  /*function getAuthData() {
        let token = localStorage.getItem("sessionToken");
        let user = localStorage.getItem("userData");

        if (!token || !user) {
            token = sessionStorage.getItem("sessionToken");
            user = sessionStorage.getItem("userData");
        }

        if (!token || !user) return null;

        return {
            token,
            user: JSON.parse(user)
        };
    }*/

  $(document).ready(() => {
    const token = localStorage.getItem("sessionToken"); 
    if (!token) { 
      window.location.href = "/auth/autenticazione.html?tab=login"; 
      return; 
    }

    $.ajax({
      url: `${apiBaseUrl}/api/auth/me`,
      type: "GET",
      headers: { Authorization: "Bearer " + token },
      success: function (user) {
        currentUser = user;
        localStorage.setItem("userData", JSON.stringify(user));

        inizializzaProfilo(user);
        caricaPrenotazioni();
      },
      error: function () {
        localStorage.clear();
        window.location.href = "/auth/autenticazione.html?tab=login";
      },
    });

    $("#logoutBtn").on("click", () => {
      localStorage.clear();
      window.location.href = "/index.html";
    });
  });

  function inizializzaProfilo(user) {
    $("#roleBadge").text(user.role);

    $("#fullName").val(user.name || "");
    $("#email").val(user.email || "");

    const role = user.role?.toLowerCase().trim();

    if (role === "mentor") {
      $("#bioWrap").show();
      $("#areasWrap").show();

      $("#bio").val(user.bio || "");
      $("#areas").val(user.skills || "");

      $("#goDashboard").attr("href", "/mentor_dashboard.html");
    } else {
      $("#goDashboard").attr("href", "/mentee_dashboard.html");
    }
  }

  function aggiornaProfilo() {
    const token = localStorage.getItem("sessionToken");

    
    $.ajax({
      url: `${apiBaseUrl}/api/auth/me`,
      type: "PUT",
      contentType: "application/json",
      headers: { Authorization: "Bearer " + token },
      data: JSON.stringify({
        name: $("#fullName").val(),
      }),
      success: function () {
        
        if (currentUser.role.toLowerCase() === "mentor") {
          aggiornaDatiMentor();
        } else {
          alert("Profilo aggiornato");
          location.reload();
        }
      },
      error: function () {
        alert("Errore aggiornamento profilo");
      },
    });
  }

  function aggiornaDatiMentor() {
    const token = localStorage.getItem("sessionToken");

    $.ajax({
      url: `${apiBaseUrl}/api/mentors/profile`,
      type: "POST",
      contentType: "application/json",
      headers: { Authorization: "Bearer " + token },
      data: JSON.stringify({
        bio: $("#bio").val(),
        skills: $("#areas").val(),
      }),
      success: function () {
        alert("Profilo mentor aggiornato");
        location.reload();
      },
      error: function () {
        alert("Errore aggiornamento profilo mentor");
      },
    });
  }

  function caricaPrenotazioni() {
    $.ajax({
      url: `${apiBaseUrl}/api/booking/my`,
      type: "GET",
      headers: {
        Authorization: "Bearer " + localStorage.getItem("sessionToken"),
      },
      success: function (bookings) {
        const tbody = $("#bookingsTbody");
        tbody.empty();

        if (!bookings || bookings.length === 0) {
          tbody.append(
            `<tr><td colspan="4" class="text-muted">Nessuna prenotazione</td></tr>`
          );
          return;
        }

        bookings.forEach((b) => {
          tbody.append(`
            <tr>
              <td>${formatDate(b.start_time)}</td>
              <td>${b.with || "—"}</td>
              <td>${b.status}</td>
              <td>
                ${
                  b.meeting_link
                    ? `<a href="${b.meeting_link}" target="_blank">Apri</a>`
                    : "—"
                }
              </td>
            </tr>
          `);
        });
      },
      error: function () {
        $("#bookingsTbody").html(
          `<tr><td colspan="4" class="text-muted">Errore caricamento</td></tr>`
        );
      },
    });
  }

  function formatDate(iso) {
    return iso ? new Date(iso).toLocaleString("it-IT") : "—";
  }

</script>

  </head>

  <body style="padding-top: 55px">
    <div id="header-placeholder"></div>

    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1">Il mio profilo</h1>
          <span class="badge bg-dark" id="roleBadge">utente</span>
        </div>
        <div class="d-flex gap-2">
          <a
            id="goDashboard"
            class="btn btn-outline-dark"
            href="dashboard_router.html"
          >
            <i class="bi bi-grid me-1"></i> Dashboard
          </a>
          <button id="logoutBtn" class="btn btn-dark">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>

      <div class="row g-4">
        <!-- Card profilo -->
        <div class="col-12 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5 fw-bold mb-3">Dati account</h2>

              <div id="profileFeedback"></div>

              <form id="profileForm">
                <div class="mb-3">
                  <label class="form-label" for="fullName">Nome completo</label>
                  <input
                    class="form-control"
                    id="fullName"
                    type="text"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label" for="email">Email</label>
                  <input
                    class="form-control"
                    id="email"
                    type="email"
                    disabled
                  />
                </div>

                <!-- Solo mentor -->
                <div class="mb-3" id="bioWrap" style="display: none">
                  <label class="form-label" for="bio">Descrizione (bio)</label>
                  <textarea
                    class="form-control"
                    id="bio"
                    rows="4"
                    placeholder="Descrivi la tua esperienza..."
                  ></textarea>
                </div>

                <div class="mb-3" id="areasWrap" style="display: none">
                  <label class="form-label" for="areas"
                    >Aree di competenza (separate da virgola)</label
                  >
                  <input
                    class="form-control"
                    id="areas"
                    type="text"
                    placeholder="Es. Software, Data, Product"
                  />
                  <div class="form-text">
                    Se usi filtri fissi in index, meglio usare valori coerenti.
                  </div>
                </div>

                <button
                  class="btn btn-dark w-100"
                  type="button"
                  onclick="aggiornaProfilo()"
                >
                  <i class="bi bi-save me-2"></i> Salva modifiche
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Agenda -->
        <div class="col-12 col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h5 fw-bold mb-3">Agenda / Prenotazioni</h2>

              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Quando</th>
                      <th>Con</th>
                      <th>Stato</th>
                      <th>Meeting</th>
                    </tr>
                  </thead>
                  <tbody id="bookingsTbody">
                    <tr>
                      <td colspan="4" class="text-muted">Caricamento...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script src="/js/headerfooterloader.js"></script>
  </body>
</html>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const accountLink = document.getElementById("account-link");
    const userData = JSON.parse(localStorage.getItem("userData"));
    
    if (!accountLink) return;

    // Se NON loggato → manda a autenticazione
    if (!userData) {
        accountLink.href = "../auth/autenticazione.html";
        return;
    }

    // Se loggato → manda alla dashboard corretta
    if (userData.role === "mentor") {
        accountLink.href = "../dashboard/mentor-dashboard.html";
    } else {
        accountLink.href = "../dashboard/mentee-dashboard.html";
    }
});
</script>

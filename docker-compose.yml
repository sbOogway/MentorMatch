version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: coworkspace-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: mydb
    volumes:
      - ./backend:/app         # sync local code → live reload
      - /app/node_modules      # avoid overwriting node_modules
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: coworkspace-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
    - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro

volumes:
  pgdata:
